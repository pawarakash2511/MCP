<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: #1a1a2e;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .header-avatar {
      width: 38px; height: 38px;
      background: #e94560;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
    }
    .header-info h1 { font-size: 1rem; font-weight: 600; }
    .header-info p  { font-size: 0.75rem; opacity: 0.6; margin-top: 1px; }
    .live-badge {
      margin-left: auto;
      background: #e94560;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .server-pills { display: flex; gap: 6px; }
    .pill {
      font-size: 0.65rem; font-weight: 600;
      padding: 2px 8px; border-radius: 999px;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .pill-js { background: #fff3cd; color: #856404; }
    .pill-py { background: #d1ecf1; color: #0c5460; }

    /* ── Chat window ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* ── Message rows ── */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      max-width: 780px;
    }
    .msg-row.user  { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.bot   { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; flex-shrink: 0;
    }
    .avatar.bot  { background: #1a1a2e; color: #e94560; }
    .avatar.user { background: #e94560; color: #fff; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.5;
      max-width: 640px;
    }
    .bubble.user {
      background: #e94560;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble.bot {
      background: #fff;
      color: #222;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }
    .bubble.error {
      background: #fff0f0;
      border: 1px solid #f5c6c6;
      color: #c0392b;
    }
    .bubble.hint {
      background: #f8f9ff;
      border: 1px solid #dde3ff;
      color: #444;
    }

    /* ── Typing indicator ── */
    .typing-dots {
      display: flex; gap: 4px; padding: 4px 0;
    }
    .typing-dots span {
      width: 7px; height: 7px; background: #aaa; border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%            { transform: translateY(-6px); }
    }

    /* ── Weather result (inside bubble) ── */
    .weather-card {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 10px;
      padding: 16px;
      color: #fff;
      margin-top: 6px;
    }
    .weather-city { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
    .weather-desc { font-size: 0.88rem; opacity: 0.7; margin-bottom: 12px; }
    .weather-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .stat { background: rgba(255,255,255,0.09); border-radius: 8px; padding: 9px 6px; text-align: center; }
    .stat-value { font-size: 1.1rem; font-weight: 700; }
    .stat-label { font-size: 0.65rem; opacity: 0.55; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.04em; }

    /* ── Nationality result (inside bubble) ── */
    .country-list { display: flex; flex-direction: column; gap: 7px; margin-top: 6px; }
    .country-row {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 11px; background: #f8f9fa; border-radius: 8px;
    }
    .country-flag { font-size: 1.3rem; }
    .country-name { flex: 1; font-size: 0.88rem; font-weight: 500; color: #333; }
    .prob-bar-wrap { width: 70px; height: 5px; background: #e5e5e5; border-radius: 999px; overflow: hidden; }
    .prob-bar { height: 100%; background: linear-gradient(90deg,#e94560,#ff7597); border-radius: 999px; }
    .country-prob { font-size: 0.82rem; font-weight: 700; color: #e94560; min-width: 32px; text-align: right; }

    /* ── MCP source badge ── */
    .mcp-source {
      display: inline-flex; align-items: center; gap: 5px;
      margin-top: 10px; font-size: 0.72rem; color: #555;
      background: #eef6ee; border: 1px solid #b7ddb7;
      border-radius: 999px; padding: 2px 9px;
    }
    .mcp-source::before { content: "✓"; color: #2e7d32; font-weight: 700; }

    /* ── Input bar ── */
    .input-bar {
      flex-shrink: 0;
      background: #fff;
      border-top: 1px solid #e8e8e8;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #userInput {
      flex: 1;
      padding: 11px 16px;
      border: 1.5px solid #ddd;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
      background: #fafafa;
    }
    #userInput:focus { border-color: #e94560; background: #fff; }
    #sendBtn {
      padding: 11px 20px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    #sendBtn:hover    { background: #c73652; }
    #sendBtn:disabled { background: #ccc; cursor: not-allowed; }

  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="header-avatar">🤖</div>
  <div class="header-info">
    <h1>MCP Chatbot</h1>
    <p>Weather · Nationality</p>
  </div>
  <div class="server-pills">
    <span class="pill pill-js">JS · :3001</span>
    <span class="pill pill-py">Py · :3002</span>
  </div>
  <span class="live-badge">Live</span>
</header>

<!-- Chat messages -->
<div id="chat"></div>

<!-- Input bar -->
<div class="input-bar">
  <input id="userInput" type="text" placeholder="Ask about weather or nationality…" autocomplete="off" />
  <button id="sendBtn" onclick="handleSend()">Send ➤</button>
</div>

<script>
  /* ─────────────────────────────────────────────
     Helpers
  ───────────────────────────────────────────── */
  function flagEmoji(code) {
    return code.toUpperCase().replace(/./g, c =>
      String.fromCodePoint(0x1F1E6 - 65 + c.charCodeAt(0)));
  }
  function countryName(code) {
    try { return new Intl.DisplayNames(['en'], { type: 'region' }).of(code.toUpperCase()); }
    catch { return code.toUpperCase(); }
  }

  /* ─────────────────────────────────────────────
     Intent parser — no external libraries
     Returns { type: 'weather'|'nationality'|'unknown', entity: string }
  ───────────────────────────────────────────── */
  function parseIntent(raw) {
    const m = raw.toLowerCase().trim()
      .replace(/[?!.,]+$/, '')        // strip trailing punctuation
      .replace(/\s+/g, ' ');          // normalise whitespace

    /* ── Weather patterns ── */
    const weatherRules = [
      // "weather in/of/for/at pune"
      /\bweather\s+(?:in|of|for|at|around)\s+(.+)/,
      // "what's/what is the weather in pune"
      /\bwhat(?:'?s| is)(?: the)?\s+weather\s+(?:in|of|for|at|around)\s+(.+)/,
      // "how's/how is the weather in pune"
      /\bhow(?:'?s| is)(?: the)?\s+weather\s+(?:in|of|for|at|around)\s+(.+)/,
      // "can you tell me weather of pune" / "tell me weather of pune"
      /\b(?:can you\s+)?(?:tell|show|check|get)(?: me)?(?: the)?\s+weather\s+(?:in|of|for|at|around)\s+(.+)/,
      // "temperature/temp in pune"
      /\b(?:temperature|temp)\s+(?:in|of|for|at|around)\s+(.+)/,
      // "what is temperature of pune"
      /\bwhat(?:'?s| is)(?: the)?\s+(?:temperature|temp)\s+(?:in|of|for|at|around)\s+(.+)/,
      // "is it raining in pune" / "forecast for pune" / "climate in pune"
      /\b(?:is it (?:raining|snowing|hot|cold)|forecast|climate|humidity)\s+(?:in|of|for|at|around)\s+(.+)/,
      // "pune weather" / "pune ka weather" / "pune city weather"
      /\b(.+?)\s+(?:ka\s+)?(?:weather|temperature|temp|forecast|climate)\b/,
    ];

    for (const re of weatherRules) {
      const match = m.match(re);
      if (match && match[1] && match[1].trim().length > 1) {
        return { type: 'weather', entity: cleanEntity(match[1]) };
      }
    }

    /* ── Nationality patterns ── */
    const nationalityRules = [
      // "nationality of amit" / "nationality for amit"
      /\bnationality\s+(?:of|for)\s+(.+)/,
      // "what is/what's the nationality of amit"
      /\bwhat(?:'?s| is)(?: the)?\s+nationality\s+(?:of|for)\s+(.+)/,
      // "what nationality is amit"
      /\bwhat\s+nationality\s+is\s+(.+)/,
      // "origin of amit"
      /\borigin\s+(?:of|for)\s+(.+)/,
      // "what is the origin of amit"
      /\bwhat(?:'?s| is)(?: the)?\s+origin\s+(?:of|for)\s+(.+)/,
      // "where is amit from" / "where does amit come from"
      /\bwhere\s+(?:is|are|does)\s+(.+?)\s+(?:from|come from|belong)/,
      // "which country is amit from"
      /\bwhich\s+country\s+(?:is|does)\s+(.+?)\s+(?:from|belong|come)/,
      // "predict nationality of amit"
      /\bpredict\s+(?:the\s+)?nationality\s+(?:of|for)\s+(.+)/,
      // "amit's nationality"
      /\b(.+?)(?:'s|s')\s+nationality/,
      // "amit name nationality" / "amit nationality"
      /\b(.+?)\s+(?:name\s+)?nationality\b/,
      // "amit name origin" / "amit origin"
      /\b(.+?)\s+(?:name\s+)?origin\b/,
    ];

    for (const re of nationalityRules) {
      const match = m.match(re);
      if (match && match[1] && match[1].trim().length > 1) {
        return { type: 'nationality', entity: cleanEntity(match[1]) };
      }
    }

    return { type: 'unknown', entity: '' };
  }

  // Strip filler words left over after extraction
  function cleanEntity(raw) {
    return raw.trim()
      .replace(/^(?:the|a|an|this|that|some)\s+/i, '')
      .replace(/\s+(?:please|pls|thanks|name)$/i, '')
      .trim();
  }

  /* ─────────────────────────────────────────────
     DOM helpers — add messages to chat
  ───────────────────────────────────────────── */
  const chat = document.getElementById('chat');

  function addMessage(who, html, extraClass = '') {
    const row = document.createElement('div');
    row.className = `msg-row ${who}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${who}`;
    avatar.textContent = who === 'bot' ? '🤖' : '👤';

    const bubble = document.createElement('div');
    bubble.className = `bubble ${who} ${extraClass}`.trim();
    bubble.innerHTML = html;

    row.appendChild(avatar);
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typing-row';
    row.innerHTML = `
      <div class="avatar bot">🤖</div>
      <div class="bubble bot">
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>`;
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  /* ─────────────────────────────────────────────
     API calls
  ───────────────────────────────────────────── */
  async function getWeather(city) {
    const res = await fetch(`http://localhost:3001/weather?city=${encodeURIComponent(city)}`);
    return res.json();
  }

  async function getNationality(name) {
    const res = await fetch(`http://localhost:3002/nationality?name=${encodeURIComponent(name)}`);
    return res.json();
  }

  /* ─────────────────────────────────────────────
     Render results into bubble HTML strings
  ───────────────────────────────────────────── */
  function renderWeather(city, data) {
    const text = data.text || '';
    const tempMatch = text.match(/(\d+)°C \(feels like (-?\d+)°C\)/);
    const humMatch  = text.match(/humidity (\d+)%/);
    const descMatch = text.match(/is (.+?),/);
    return `
      <div class="weather-card">
        <div class="weather-city">${escHtml(city)}</div>
        <div class="weather-desc">${descMatch ? escHtml(descMatch[1]) : ''}</div>
        <div class="weather-stats">
          <div class="stat">
            <div class="stat-value">${tempMatch ? tempMatch[1] : '--'}°C</div>
            <div class="stat-label">Temperature</div>
          </div>
          <div class="stat">
            <div class="stat-value">${tempMatch ? tempMatch[2] : '--'}°C</div>
            <div class="stat-label">Feels Like</div>
          </div>
          <div class="stat">
            <div class="stat-value">${humMatch ? humMatch[1] : '--'}%</div>
            <div class="stat-label">Humidity</div>
          </div>
        </div>
      </div>
      ${data.server ? `<div><span class="mcp-source">${escHtml(data.server)}</span></div>` : ''}`;
  }

  function renderNationality(name, data) {
    const countries = data.country || [];
    if (!countries.length) return `<p>No nationality predictions found for <strong>${escHtml(name)}</strong>.</p>`;
    const rows = countries.map(c => {
      const prob = Math.round(c.probability * 100);
      return `
        <div class="country-row">
          <span class="country-flag">${flagEmoji(c.country_id)}</span>
          <span class="country-name">${escHtml(countryName(c.country_id))}</span>
          <div class="prob-bar-wrap"><div class="prob-bar" style="width:${prob}%"></div></div>
          <span class="country-prob">${prob}%</span>
        </div>`;
    }).join('');
    return `
      <div style="font-size:0.85rem;color:#666;margin-bottom:6px;">Nationality prediction for <strong>${escHtml(name)}</strong>:</div>
      <div class="country-list">${rows}</div>
      ${data.server ? `<div><span class="mcp-source">${escHtml(data.server)}</span></div>` : ''}`;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ─────────────────────────────────────────────
     Main send handler
  ───────────────────────────────────────────── */
  async function handleSend() {
    const input = document.getElementById('userInput');
    const btn   = document.getElementById('sendBtn');
    const text  = input.value.trim();
    if (!text) return;

    input.value = '';
    btn.disabled = true;

    // Show user message
    addMessage('user', escHtml(text));

    // Parse intent
    const { type, entity } = parseIntent(text);

    // Show typing indicator
    addTyping();

    try {
      if (type === 'weather') {
        const data = await getWeather(entity);
        removeTyping();
        if (data.error) {
          addMessage('bot', `<strong>Could not fetch weather.</strong><br><small>${escHtml(data.error)}</small>`, 'error');
        } else {
          addMessage('bot', renderWeather(entity, data));
        }

      } else if (type === 'nationality') {
        const data = await getNationality(entity);
        removeTyping();
        if (data.error) {
          addMessage('bot', `<strong>Could not fetch nationality.</strong><br><small>${escHtml(data.error)}</small>`, 'error');
        } else {
          addMessage('bot', renderNationality(entity, data));
        }

      } else {
        // Out of context
        removeTyping();
        addMessage('bot',
          `Sorry, MCP is not configured for that information. I can only assist with weather and nationality queries.`,
          'hint'
        );
      }
    } catch (err) {
      removeTyping();
      addMessage('bot',
        `<strong>Server unreachable.</strong> Make sure your MCP servers are running via VSCode or manually.<br><small>${escHtml(err.message)}</small>`,
        'error'
      );
    }

    btn.disabled = false;
    input.focus();
  }

  // Enter key sends
  document.getElementById('userInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) handleSend();
  });

  /* ─────────────────────────────────────────────
     Welcome message on load
  ───────────────────────────────────────────── */
  window.addEventListener('load', () => {
    addMessage('bot',
      `Hello! I'm your MCP assistant. How can I help you today?`
    );
  });
</script>

</body>
</html>
