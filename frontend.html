<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: #1a1a2e;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .header-avatar {
      width: 38px; height: 38px;
      background: #e94560;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
    }
    .header-info h1 { font-size: 1rem; font-weight: 600; }
    .header-info p  { font-size: 0.75rem; opacity: 0.6; margin-top: 1px; }
    .live-badge {
      margin-left: auto;
      background: #e94560;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .server-pills { display: flex; gap: 6px; }
    .pill {
      font-size: 0.65rem; font-weight: 600;
      padding: 2px 8px; border-radius: 999px;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .pill-js { background: #fff3cd; color: #856404; }
    .pill-py { background: #d1ecf1; color: #0c5460; }
    .pill-node { background: #e3d9f7; color: #4b2e83; }

    /* ── Chat window ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* ── Message rows ── */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      max-width: 780px;
    }
    .msg-row.user  { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.bot   { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; flex-shrink: 0;
    }
    .avatar.bot  { background: #1a1a2e; color: #e94560; }
    .avatar.user { background: #e94560; color: #fff; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.5;
      max-width: 640px;
    }
    .bubble.user {
      background: #e94560;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble.bot {
      background: #fff;
      color: #222;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }
    .bubble.error {
      background: #fff0f0;
      border: 1px solid #f5c6c6;
      color: #c0392b;
    }
    .bubble.hint {
      background: #f8f9ff;
      border: 1px solid #dde3ff;
      color: #444;
    }

    /* ── Typing indicator ── */
    .typing-dots {
      display: flex; gap: 4px; padding: 4px 0;
    }
    .typing-dots span {
      width: 7px; height: 7px; background: #aaa; border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%            { transform: translateY(-6px); }
    }

    /* ── MCP source badge ── */
    .mcp-source {
      display: inline-flex; align-items: center; gap: 5px;
      margin-top: 8px; font-size: 0.72rem; color: #555;
      background: #eef6ee; border: 1px solid #b7ddb7;
      border-radius: 999px; padding: 2px 9px;
    }
    .mcp-source::before { content: "✓"; color: #2e7d32; font-weight: 700; }

    /* ── Input bar ── */
    .input-bar {
      flex-shrink: 0;
      background: #fff;
      border-top: 1px solid #e8e8e8;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #userInput {
      flex: 1;
      padding: 11px 16px;
      border: 1.5px solid #ddd;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
      background: #fafafa;
    }
    #userInput:focus { border-color: #e94560; background: #fff; }
    #sendBtn {
      padding: 11px 20px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    #sendBtn:hover    { background: #c73652; }
    #sendBtn:disabled { background: #ccc; cursor: not-allowed; }

  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="header-avatar">🤖</div>
  <div class="header-info">
    <h1>MCP Chatbot</h1>
    <p>Weather · Nationality · Exchange Rates</p>
  </div>
  <div class="server-pills">
    <span class="pill pill-js">JS · :3001</span>
    <span class="pill pill-py">Py · :3002</span>
    <span class="pill pill-node">Node · :3003</span>
  </div>
  <span class="live-badge">Live</span>
</header>

<!-- Chat messages -->
<div id="chat"></div>

<!-- Input bar -->
<div class="input-bar">
  <input id="userInput" type="text" placeholder="Ask about weather, nationality, or currency exchange…" autocomplete="off" />
  <button id="sendBtn" onclick="handleSend()">Send ➤</button>
</div>

<script>
  /* ─────────────────────────────────────────────
     Helpers
  ───────────────────────────────────────────── */
  function flagEmoji(code) {
    return code.toUpperCase().replace(/./g, c =>
      String.fromCodePoint(0x1F1E6 - 65 + c.charCodeAt(0)));
  }
  function countryName(code) {
    try { return new Intl.DisplayNames(['en'], { type: 'region' }).of(code.toUpperCase()); }
    catch { return code.toUpperCase(); }
  }

  /* ─────────────────────────────────────────────
     Intent parser — calls Grok LLM via /parse endpoint on the MCP server
     Returns { type: 'weather'|'nationality'|'exchange'|'unknown', entity, tool, args }
  ───────────────────────────────────────────── */
  async function parseIntent(message) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000); // 10s timeout
    try {
      const res = await fetch(`http://localhost:3001/parse?q=${encodeURIComponent(message)}`, { signal: controller.signal });
      return res.json();
    } finally {
      clearTimeout(timeout);
    }
  }

  /* ─────────────────────────────────────────────
     DOM helpers — add messages to chat
  ───────────────────────────────────────────── */
  const chat = document.getElementById('chat');

  function addMessage(who, html, extraClass = '') {
    const row = document.createElement('div');
    row.className = `msg-row ${who}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${who}`;
    avatar.textContent = who === 'bot' ? '🤖' : '👤';

    const bubble = document.createElement('div');
    bubble.className = `bubble ${who} ${extraClass}`.trim();
    bubble.innerHTML = html;

    row.appendChild(avatar);
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typing-row';
    row.innerHTML = `
      <div class="avatar bot">🤖</div>
      <div class="bubble bot">
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>`;
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  /* ─────────────────────────────────────────────
     API calls
  ───────────────────────────────────────────── */
  async function getWeather(city) {
    const res = await fetch(`http://localhost:3001/weather?city=${encodeURIComponent(city)}`);
    return res.json();
  }

  async function getNationality(name) {
    const res = await fetch(`http://localhost:3002/nationality?name=${encodeURIComponent(name)}`);
    return res.json();
  }

  async function getExchange(tool, args) {
    const params = new URLSearchParams({ tool, ...args });
    const res = await fetch(`http://localhost:3003/exchange?${params.toString()}`);
    return res.json();
  }

  /* ─────────────────────────────────────────────
     Render results into bubble HTML strings
  ───────────────────────────────────────────── */
  function renderWeather(data) {
    const text = escHtml(data.text || 'No weather data available.');
    const badge = data.server ? `<br><span class="mcp-source">${escHtml(data.server)}</span>` : '';
    return text + badge;
  }

  function renderNationality(name, data) {
    const countries = data.country || [];
    if (!countries.length) {
      return `No nationality predictions found for <strong>${escHtml(name)}</strong>.`;
    }
    // Build a natural sentence: "Amit is most likely from India (85%), Pakistan (8%), Bangladesh (4%)."
    const parts = countries.map((c, i) => {
      const prob = Math.round(c.probability * 100);
      const nation = escHtml(countryName(c.country_id));
      const flag = flagEmoji(c.country_id);
      return i === 0
        ? `most likely from ${flag} ${nation} (${prob}%)`
        : `${flag} ${nation} (${prob}%)`;
    });
    const sentence = `The name <strong>${escHtml(name)}</strong> is ${parts[0]}` +
      (parts.length > 1 ? `, followed by ${parts.slice(1).join(', ')}` : '') + '.';
    const badge = data.server ? `<br><span class="mcp-source">${escHtml(data.server)}</span>` : '';
    return sentence + badge;
  }

  function renderExchange(tool, data) {
    const badge = data.server ? `<br><span class="mcp-source">${escHtml(data.server)}</span>` : '';
    let sentence;

    if (tool === 'get_exchange_rate') {
      sentence = `The latest Bank of Israel rate is <strong>${escHtml(data.unit)}</strong> (as of ${escHtml(data.date)}).`;

    } else if (tool === 'convert_currency') {
      sentence = `<strong>${data.from.amount} ${escHtml(data.from.currency)}</strong> = ` +
        `<strong>${data.to.amount} ${escHtml(data.to.currency)}</strong> ` +
        `(rate: ${escHtml(data.rateDescription)}, as of ${escHtml(data.rateDate)}).`;

    } else if (tool === 'list_currencies') {
      const codes = (data.currencies || []).join(', ');
      sentence = `The Bank of Israel publishes rates for ${data.count} currencies: ${escHtml(codes)}.`;

    } else if (tool === 'get_rate_change') {
      const sign = data.absoluteChange > 0 ? '+' : '';
      sentence = `${escHtml(data.currency)} went from ${data.startRate} ILS (${escHtml(data.startDate)}) ` +
        `to ${data.endRate} ILS (${escHtml(data.endDate)}) — a change of ${sign}${data.absoluteChange} ` +
        `(${sign}${data.percentChange}%). ${escHtml(data.direction)}.`;

    } else if (tool === 'get_historical_rates') {
      const rows = (data.rates || []).map(r => `${escHtml(r.date)}: ${r.rate}`).join('<br>');
      sentence = `${escHtml(data.currency)} rates from ${escHtml(data.startDate)} to ${escHtml(data.endDate)}:<br>${rows}`;

    } else {
      sentence = data.text ? escHtml(data.text) : 'No exchange data available.';
    }

    return sentence + badge;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ─────────────────────────────────────────────
     Main send handler
  ───────────────────────────────────────────── */
  async function handleSend() {
    const input = document.getElementById('userInput');
    const btn   = document.getElementById('sendBtn');
    const text  = input.value.trim();
    if (!text) return;

    input.value = '';
    btn.disabled = true;

    // Show user message
    addMessage('user', escHtml(text));

    // Show typing indicator while Grok + MCP servers respond
    addTyping();

    // Parse intent via Grok LLM
    const { type, entity, tool, args } = await parseIntent(text);

    try {
      if (type === 'weather') {
        const data = await getWeather(entity);
        removeTyping();
        if (data.error) {
          addMessage('bot', `<strong>Could not fetch weather.</strong><br><small>${escHtml(data.error)}</small>`, 'error');
        } else {
          addMessage('bot', renderWeather(data));
        }

      } else if (type === 'nationality') {
        const data = await getNationality(entity);
        removeTyping();
        if (data.error) {
          addMessage('bot', `<strong>Could not fetch nationality.</strong><br><small>${escHtml(data.error)}</small>`, 'error');
        } else {
          addMessage('bot', renderNationality(entity, data));
        }

      } else if (type === 'exchange') {
        const data = await getExchange(tool, args || {});
        removeTyping();
        if (data.error) {
          addMessage('bot', `<strong>Could not fetch exchange data.</strong><br><small>${escHtml(data.error)}</small>`, 'error');
        } else {
          addMessage('bot', renderExchange(tool, data));
        }

      } else {
        // Out of context
        removeTyping();
        addMessage('bot',
          `Sorry, MCP is not configured for that information. I can only assist with weather, nationality, and currency exchange queries.`,
          'hint'
        );
      }
    } catch (err) {
      removeTyping();
      addMessage('bot',
        `<strong>Server unreachable.</strong> Make sure your MCP servers are running via VSCode or manually.<br><small>${escHtml(err.message)}</small>`,
        'error'
      );
    }

    btn.disabled = false;
    input.focus();
  }

  // Enter key sends
  document.getElementById('userInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) handleSend();
  });

  /* ─────────────────────────────────────────────
     Welcome message on load
  ───────────────────────────────────────────── */
  window.addEventListener('load', () => {
    addMessage('bot',
      `Hello! I'm your MCP assistant. How can I help you today?`
    );
  });
</script>

</body>
</html>
